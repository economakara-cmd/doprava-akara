<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AKARA Doprava</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blue:      #1a3f72;
    --blue-mid:  #215a9e;
    --blue-lt:   #2d7dd2;
    --accent:    #f0a500;
    --bg:        #f0f4fa;
    --card:      #ffffff;
    --text:      #1a1a2e;
    --muted:     #6b7a99;
    --border:    #d0daea;
    --green:     #2ecc71;
    --red:       #e74c3c;
    --radius:    14px;
    --shadow:    0 4px 20px rgba(26,63,114,.12);
  }

  html, body {
    height: 100%; min-height: 100vh;
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  /* ── SCREENS ── */
  .screen { display: none; min-height: 100vh; padding: 0; }
  .screen.active { display: flex; flex-direction: column; }

  /* ── LOGIN ── */
  #s-login {
    background: linear-gradient(160deg, var(--blue) 0%, var(--blue-mid) 60%, var(--blue-lt) 100%);
    align-items: center; justify-content: center; padding: 24px;
  }
  .login-box {
    background: var(--card); border-radius: 20px;
    box-shadow: 0 8px 40px rgba(0,0,0,.25);
    padding: 32px 28px 28px; width: 100%; max-width: 360px;
    display: flex; flex-direction: column; align-items: center; gap: 20px;
  }
  .logo { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .logo-icon {
    width: 64px; height: 64px; border-radius: 16px;
    background: var(--blue); display: flex; align-items: center; justify-content: center;
  }
  .logo-icon svg { width: 36px; height: 36px; fill: #fff; }
  .logo h1 { font-size: 1.5rem; font-weight: 700; color: var(--blue); }
  .logo p  { font-size: .8rem; color: var(--muted); }

  .pin-display {
    width: 100%; background: var(--bg); border-radius: 10px;
    padding: 14px 18px; font-size: 1.6rem; font-weight: 700;
    letter-spacing: 6px; text-align: center; color: var(--blue);
    min-height: 58px; border: 2px solid var(--border);
    transition: border-color .2s;
  }
  .pin-display.error { border-color: var(--red); color: var(--red); letter-spacing: 2px; font-size: 1rem; }

  .numpad {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%;
  }
  .np-btn {
    height: 58px; border: none; border-radius: 10px; font-size: 1.3rem;
    font-weight: 600; cursor: pointer; transition: all .12s;
    font-family: 'Inter', sans-serif;
  }
  .np-btn.digit {
    background: var(--bg); color: var(--blue); border: 1.5px solid var(--border);
  }
  .np-btn.digit:active { background: #d6e4f7; transform: scale(.96); }
  .np-btn.del  { background: #fdecea; color: var(--red); border: 1.5px solid #f5c6c2; }
  .np-btn.del:active { background: #f9b8b3; }
  .np-btn.ok   { background: var(--blue); color: #fff; grid-column: span 3; height: 54px; font-size: 1rem; letter-spacing: 1px; border-radius: 12px; }
  .np-btn.ok:active { background: var(--blue-mid); }

  /* ── TOP BAR ── */
  .topbar {
    background: var(--blue); color: #fff;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; gap: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,.2);
    position: sticky; top: 0; z-index: 100;
  }
  .topbar-left { display: flex; align-items: center; gap: 10px; }
  .topbar h2 { font-size: 1rem; font-weight: 700; }
  .user-chip {
    background: rgba(255,255,255,.15); border-radius: 20px;
    padding: 4px 12px; font-size: .78rem; font-weight: 500;
  }
  .btn-icon {
    background: rgba(255,255,255,.15); border: none; color: #fff;
    width: 36px; height: 36px; border-radius: 8px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s;
  }
  .btn-icon:hover { background: rgba(255,255,255,.28); }
  .btn-icon svg { width: 18px; height: 18px; fill: #fff; }

  /* ── TABS ── */
  .tabs {
    display: flex; background: var(--blue);
    border-top: 1px solid rgba(255,255,255,.15);
  }
  .tab-btn {
    flex: 1; padding: 12px 4px; font-size: .75rem; font-weight: 600;
    color: rgba(255,255,255,.6); background: none; border: none; cursor: pointer;
    border-bottom: 3px solid transparent; transition: all .15s;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .tab-btn svg { width: 20px; height: 20px; fill: currentColor; }
  .tab-btn.active { color: #fff; border-bottom-color: var(--accent); }

  /* ── CONTENT ── */
  .content { flex: 1; padding: 16px; overflow-y: auto; }
  .tab-pane { display: none; }
  .tab-pane.active { display: block; }

  /* ── CARDS & FORM ── */
  .card {
    background: var(--card); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 20px; margin-bottom: 14px;
  }
  .card-title {
    font-size: .85rem; font-weight: 700; color: var(--blue);
    text-transform: uppercase; letter-spacing: .5px; margin-bottom: 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .card-title svg { width: 16px; height: 16px; fill: var(--blue); }

  .field { margin-bottom: 14px; }
  .field label {
    display: block; font-size: .78rem; font-weight: 600;
    color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .4px;
  }
  .field select, .field input[type="date"] {
    width: 100%; padding: 12px 14px; border-radius: 10px;
    border: 1.5px solid var(--border); font-size: 1rem;
    font-family: 'Inter', sans-serif; color: var(--text);
    background: var(--bg); outline: none; appearance: none;
    -webkit-appearance: none; transition: border-color .2s;
  }
  .field select:focus, .field input[type="date"]:focus { border-color: var(--blue-lt); }

  .type-toggle {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  }
  .type-btn {
    padding: 13px 8px; border-radius: 10px; border: 2px solid var(--border);
    font-size: .9rem; font-weight: 600; cursor: pointer; background: var(--bg);
    color: var(--muted); transition: all .15s; text-align: center;
  }
  .type-btn.sel-dovoz  { background: #e8f4fd; border-color: var(--blue-lt); color: var(--blue); }
  .type-btn.sel-odvoz  { background: #fdf3e8; border-color: #e67e22;        color: #c05a00; }

  .btn-submit {
    width: 100%; padding: 16px; background: var(--blue);
    color: #fff; border: none; border-radius: 12px; font-size: 1rem;
    font-weight: 700; cursor: pointer; letter-spacing: .5px;
    transition: background .15s; margin-top: 6px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-submit:active { background: var(--blue-mid); }
  .btn-submit svg { width: 18px; height: 18px; fill: #fff; }
  .btn-submit:disabled { opacity: .6; cursor: not-allowed; }

  /* ── TOAST ── */
  #toast {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: #222; color: #fff; padding: 12px 22px; border-radius: 24px;
    font-size: .88rem; font-weight: 500; opacity: 0; pointer-events: none;
    transition: all .3s; z-index: 9999; white-space: nowrap; max-width: 90vw;
    text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.ok   { background: var(--green); }
  #toast.err  { background: var(--red); }
  #toast.warn { background: var(--accent); color: #333; }

  /* ── HISTORY ── */
  .hist-item {
    background: var(--card); border-radius: 12px;
    box-shadow: 0 2px 8px rgba(26,63,114,.08);
    padding: 14px 16px; margin-bottom: 10px;
    border-left: 4px solid var(--blue-lt);
    display: flex; flex-direction: column; gap: 4px;
  }
  .hist-item.dovoz { border-left-color: var(--blue-lt); }
  .hist-item.odvoz { border-left-color: #e67e22; }
  .hist-top { display: flex; align-items: center; justify-content: space-between; }
  .hist-badge {
    font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 10px;
  }
  .hist-badge.dovoz { background: #e8f4fd; color: var(--blue); }
  .hist-badge.odvoz { background: #fdf3e8; color: #c05a00; }
  .hist-badge.ok    { background: #d5f5e3; color: #1a7a40; }
  .hist-badge.fail  { background: #fdecea; color: var(--red); }
  .hist-main { font-size: .95rem; font-weight: 600; color: var(--text); }
  .hist-sub  { font-size: .78rem; color: var(--muted); }

  .empty-state {
    text-align: center; padding: 48px 24px; color: var(--muted);
  }
  .empty-state svg { width: 48px; height: 48px; fill: var(--border); margin-bottom: 12px; }
  .empty-state p { font-size: .9rem; }

  /* ── PROFILE ── */
  .profile-card {
    background: linear-gradient(135deg, var(--blue) 0%, var(--blue-lt) 100%);
    border-radius: var(--radius); color: #fff; padding: 24px; margin-bottom: 14px;
    display: flex; align-items: center; gap: 16px;
  }
  .avatar {
    width: 56px; height: 56px; border-radius: 50%;
    background: rgba(255,255,255,.2); display: flex;
    align-items: center; justify-content: center; font-size: 1.4rem; font-weight: 700;
    flex-shrink: 0;
  }
  .profile-info h3 { font-size: 1.1rem; font-weight: 700; }
  .profile-info p  { font-size: .82rem; opacity: .8; margin-top: 2px; }

  .info-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0; border-bottom: 1px solid var(--border); font-size: .9rem;
  }
  .info-row:last-child { border-bottom: none; }
  .info-label { color: var(--muted); font-size: .78rem; font-weight: 600; text-transform: uppercase; }
  .info-val   { font-weight: 600; color: var(--text); }

  .btn-logout {
    width: 100%; padding: 14px; background: #fdecea; color: var(--red);
    border: 2px solid #f5c6c2; border-radius: 12px; font-size: .95rem;
    font-weight: 700; cursor: pointer; margin-top: 8px; transition: background .15s;
  }
  .btn-logout:active { background: #f9c6c2; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>

<!-- ══════════ LOGIN SCREEN ══════════ -->
<div id="s-login" class="screen active">
  <div class="login-box">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
      </div>
      <h1>AKARA Doprava</h1>
      <p>Evidencia dopravy zamestnancov</p>
    </div>

    <div id="pin-display" class="pin-display">____</div>

    <div class="numpad">
      <button class="np-btn digit" onclick="npPress('1')">1</button>
      <button class="np-btn digit" onclick="npPress('2')">2</button>
      <button class="np-btn digit" onclick="npPress('3')">3</button>
      <button class="np-btn digit" onclick="npPress('4')">4</button>
      <button class="np-btn digit" onclick="npPress('5')">5</button>
      <button class="np-btn digit" onclick="npPress('6')">6</button>
      <button class="np-btn digit" onclick="npPress('7')">7</button>
      <button class="np-btn digit" onclick="npPress('8')">8</button>
      <button class="np-btn digit" onclick="npPress('9')">9</button>
      <button class="np-btn del"   onclick="npDel()">⌫</button>
      <button class="np-btn digit" onclick="npPress('0')">0</button>
      <button class="np-btn digit" onclick="npPress('0')" style="visibility:hidden"></button>
      <button class="np-btn ok"    onclick="login()">PRIHLÁSIŤ</button>
    </div>
  </div>
</div>

<!-- ══════════ MAIN SCREEN ══════════ -->
<div id="s-main" class="screen">

  <!-- Top bar -->
  <div class="topbar">
    <div class="topbar-left">
      <svg viewBox="0 0 24 24" style="width:24px;height:24px;fill:#fff;flex-shrink:0">
        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
      </svg>
      <div>
        <div style="font-size:.7rem;opacity:.7;font-weight:500">AKARA</div>
        <div style="font-size:.95rem;font-weight:700">Doprava</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <span id="topbar-user" class="user-chip"></span>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" onclick="showTab('form')" id="tab-form">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
      Nahlásenie
    </button>
    <button class="tab-btn" onclick="showTab('history')" id="tab-history">
      <svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
      História
    </button>
    <button class="tab-btn" onclick="showTab('profile')" id="tab-profile">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      Profil
    </button>
  </div>

  <!-- Content -->
  <div class="content">

    <!-- ── FORM TAB ── -->
    <div id="tab-pane-form" class="tab-pane active">

      <div class="card">
        <div class="card-title">
          <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg>
          Dátum a zmena
        </div>

        <div class="field">
          <label>Dátum</label>
          <input type="date" id="f-date">
        </div>

        <div class="field">
          <label>Zmena</label>
          <select id="f-shift" onchange="updateStops()">
            <option value="">-- Vyber zmenu --</option>
            <option value="06-14">06:00 – 14:00</option>
            <option value="14-22">14:00 – 22:00</option>
            <option value="22-06">22:00 – 06:00</option>
            <option value="06-18">06:00 – 18:00</option>
            <option value="18-06">18:00 – 06:00</option>
          </select>
        </div>
      </div>

      <div class="card">
        <div class="card-title">
          <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
          Linka a zastávka
        </div>

        <div class="field">
          <label>Linka</label>
          <select id="f-line" onchange="updateStops()">
            <option value="">-- Vyber linku --</option>
            <option value="L1">L1 – Nitra – Lužianky – Zbehy</option>
            <option value="L2">L2 – Radošina – V.Ripňany – Nové Sady</option>
            <option value="L4">L4 – Topoľčany – Oponice – Čakajovce</option>
            <option value="L5">L5 – Rišňovce – Lukáčovce – Zbehy</option>
            <option value="L6">L6 – Nové Zámky – Komjatice – Dražovce</option>
          </select>
        </div>

        <div class="field">
          <label>Zastávka</label>
          <select id="f-stop">
            <option value="">-- Najprv vyber linku a zmenu --</option>
          </select>
        </div>
      </div>

      <div class="card">
        <div class="card-title">
          <svg viewBox="0 0 24 24"><path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zm-.5 1.5 1.96 2.5H17V9.5h2.5zM6 18c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm13.5 0c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/></svg>
          Typ dopravy
        </div>

        <div class="type-toggle">
          <button class="type-btn" id="btn-dovoz" onclick="setType('dovoz')">🚌 Dovoz</button>
          <button class="type-btn" id="btn-odvoz" onclick="setType('odvoz')">🏠 Odvoz</button>
        </div>
      </div>

      <button class="btn-submit" id="btn-submit" onclick="submitOrder()">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        Odoslať nahlásenie
      </button>
    </div>

    <!-- ── HISTORY TAB ── -->
    <div id="tab-pane-history" class="tab-pane">
      <div id="hist-list"></div>
    </div>

    <!-- ── PROFILE TAB ── -->
    <div id="tab-pane-profile" class="tab-pane">
      <div class="profile-card">
        <div class="avatar" id="prof-avatar"></div>
        <div class="profile-info">
          <h3 id="prof-name"></h3>
          <p id="prof-firm"></p>
        </div>
      </div>

      <div class="card">
        <div class="info-row">
          <span class="info-label">Osobné číslo</span>
          <span class="info-val" id="prof-id"></span>
        </div>
        <div class="info-row">
          <span class="info-label">Firma</span>
          <span class="info-val" id="prof-firm2"></span>
        </div>
        <div class="info-row">
          <span class="info-label">Nahlásenia celkom</span>
          <span class="info-val" id="prof-count">0</span>
        </div>
      </div>

      <button class="btn-logout" onclick="logout()">Odhlásiť sa</button>
    </div>

  </div><!-- /content -->
</div><!-- /s-main -->

<div id="toast"></div>

var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzRB5_T6ncUme9xSWx5wQ5vGoYLHeL16T1ChPngpXZGixGUzN2qWGW20aTMkBQ0ZVqPOA/exec";

/* ═══════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════ */
var currentUser = null; // { id, name, firm }
var pinBuffer   = "";
var orderType   = "";
var history     = [];

/* ═══════════════════════════════════════════════
   NUMPAD
═══════════════════════════════════════════════ */
function npPress(d) {
  if (pinBuffer.length >= 6) return;
  pinBuffer += d;
  refreshPin();
}
function npDel() {
  pinBuffer = pinBuffer.slice(0, -1);
  refreshPin();
}
function refreshPin() {
  var el = document.getElementById('pin-display');
  el.classList.remove('error');
  el.textContent = pinBuffer.length ? pinBuffer.replace(/./g, '●') : '____';
}

/* ═══════════════════════════════════════════════
   LOGIN  ← synchronous, pure JS object lookup
═══════════════════════════════════════════════ */
function login() {
  var id = pinBuffer.trim();
  if (!id) { showPinError("Zadaj osobné číslo"); return; }

  /* Try exact match, then zero-padded variants */
  var name = EMP[id] || EMP[padId(id, 3)] || EMP[padId(id, 4)];

  if (!name) {
    showPinError("Číslo " + id + " nenájdené");
    pinBuffer = "";
    return;
  }

  /* Resolve canonical key (the one that matched) */
  var key = EMP[id] ? id : (EMP[padId(id, 3)] ? padId(id, 3) : padId(id, 4));

  currentUser = { id: key, name: name, firm: "BIA" };
  pinBuffer = "";

  /* Init main screen */
  document.getElementById('topbar-user').textContent = currentUser.name.split(' ')[0];
  setTodayDate();
  refreshProfile();

  document.getElementById('s-login').classList.remove('active');
  document.getElementById('s-main').classList.add('active');
}

function padId(id, len) {
  while (id.length < len) id = "0" + id;
  return id;
}

function showPinError(msg) {
  var el = document.getElementById('pin-display');
  el.textContent = msg;
  el.classList.add('error');
  setTimeout(function() { el.classList.remove('error'); el.textContent = '____'; }, 1800);
}

/* ═══════════════════════════════════════════════
   LOGOUT
═══════════════════════════════════════════════ */
function logout() {
  currentUser = null; orderType = ""; pinBuffer = "";
  document.getElementById('pin-display').textContent = '____';
  document.getElementById('f-shift').value = '';
  document.getElementById('f-line').value  = '';
  document.getElementById('f-stop').innerHTML = '<option>-- Najprv vyber linku a zmenu --</option>';
  ['btn-dovoz','btn-odvoz'].forEach(function(id){ document.getElementById(id).className='type-btn'; });
  showTab('form');
  document.getElementById('s-main').classList.remove('active');
  document.getElementById('s-login').classList.add('active');
}

/* ═══════════════════════════════════════════════
   TABS
═══════════════════════════════════════════════ */
function showTab(name) {
  ['form','history','profile'].forEach(function(t) {
    document.getElementById('tab-'+t).classList.toggle('active', t===name);
    document.getElementById('tab-pane-'+t).classList.toggle('active', t===name);
  });
  if (name === 'history') renderHistory();
  if (name === 'profile') refreshProfile();
}

/* ═══════════════════════════════════════════════
   FORM HELPERS
═══════════════════════════════════════════════ */
function setTodayDate() {
  var d = new Date();
  var y = d.getFullYear();
  var m = String(d.getMonth()+1).padStart(2,'0');
  var day = String(d.getDate()).padStart(2,'0');
  document.getElementById('f-date').value = y+'-'+m+'-'+day;
}

function setType(t) {
  orderType = t;
  document.getElementById('btn-dovoz').className = 'type-btn' + (t==='dovoz' ? ' sel-dovoz' : '');
  document.getElementById('btn-odvoz').className = 'type-btn' + (t==='odvoz' ? ' sel-odvoz' : '');
}

function updateStops() {
  var line  = document.getElementById('f-line').value;
  var shift = document.getElementById('f-shift').value;
  var sel   = document.getElementById('f-stop');
  sel.innerHTML = '';

  if (!line || !shift) {
    sel.innerHTML = '<option value="">-- Najprv vyber linku a zmenu --</option>';
    return;
  }

  var stops = (STOPS[line] && STOPS[line][shift]) ? STOPS[line][shift] : [];
  if (!stops.length) {
    sel.innerHTML = '<option value="">-- Žiadne zastávky --</option>';
    return;
  }
  sel.innerHTML = '<option value="">-- Vyber zastávku --</option>';
  stops.forEach(function(s) {
    var o = document.createElement('option');
    o.value = s; o.textContent = s;
    sel.appendChild(o);
  });
}

/* ═══════════════════════════════════════════════
   SUBMIT
═══════════════════════════════════════════════ */
function submitOrder() {
  var date  = document.getElementById('f-date').value;
  var shift = document.getElementById('f-shift').value;
  var line  = document.getElementById('f-line').value;
  var stop  = document.getElementById('f-stop').value;

  if (!date)       { toast("Vyber dátum", "err"); return; }
  if (!shift)      { toast("Vyber zmenu", "err"); return; }
  if (!line)       { toast("Vyber linku", "err"); return; }
  if (!stop)       { toast("Vyber zastávku", "err"); return; }
  if (!orderType)  { toast("Vyber typ (Dovoz / Odvoz)", "err"); return; }

  var payload = {
    action:    "newOrder",
    employeeId: currentUser.id,
    name:      currentUser.name,
    firm:      currentUser.firm,
    date:      date,
    shift:     shift,
    line:      line,
    stop:      stop,
    type:      orderType,
    ts:        new Date().toISOString()
  };

  var btn = document.getElementById('btn-submit');
  btn.disabled = true;
  btn.innerHTML = '<svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:#fff;animation:spin 1s linear infinite"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 14.03 20 13.07 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg> Odosiela sa…';

  fetch(APPS_SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify(payload)
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    var entry = Object.assign({}, payload, { status: "ok", localId: Date.now() });
    history.unshift(entry);
    toast("✓ Nahlásenie odoslané!", "ok");
  })
  .catch(function() {
    /* Save locally even if server fails */
    var entry = Object.assign({}, payload, { status: "fail", localId: Date.now() });
    history.unshift(entry);
    toast("Uložené lokálne (server nedostupný)", "warn");
  })
  .finally(function() {
    btn.disabled = false;
    btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg> Odoslať nahlásenie';
    refreshProfileCount();
  });
}

/* ═══════════════════════════════════════════════
   HISTORY
═══════════════════════════════════════════════ */
function renderHistory() {
  var el = document.getElementById('hist-list');
  if (!history.length) {
    el.innerHTML = '<div class="empty-state"><svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg><p>Zatiaľ žiadne nahlásenia</p></div>';
    return;
  }
  el.innerHTML = history.map(function(h) {
    var d = new Date(h.ts);
    var time = d.toLocaleTimeString('sk-SK', {hour:'2-digit',minute:'2-digit'});
    var dateStr = d.toLocaleDateString('sk-SK', {day:'2-digit',month:'2-digit',year:'numeric'});
    return '<div class="hist-item '+h.type+'">' +
      '<div class="hist-top">' +
        '<span class="hist-badge '+h.type+'">'+(h.type==='dovoz'?'🚌 Dovoz':'🏠 Odvoz')+'</span>' +
        '<span class="hist-badge '+(h.status==='ok'?'ok':'fail')+'">'+(h.status==='ok'?'✓ Odoslané':'⚠ Lokálne')+'</span>' +
      '</div>' +
      '<div class="hist-main">'+h.line+' &mdash; '+h.stop+'</div>' +
      '<div class="hist-sub">'+h.date+' &bull; Zmena '+h.shift+' &bull; '+dateStr+' '+time+'</div>' +
    '</div>';
  }).join('');
}

/* ═══════════════════════════════════════════════
   PROFILE
═══════════════════════════════════════════════ */
function refreshProfile() {
  if (!currentUser) return;
  var initials = currentUser.name.split(' ').map(function(w){ return w[0]; }).join('').slice(0,2).toUpperCase();
  document.getElementById('prof-avatar').textContent = initials;
  document.getElementById('prof-name').textContent   = currentUser.name;
  document.getElementById('prof-firm').textContent   = currentUser.firm;
  document.getElementById('prof-id').textContent     = currentUser.id;
  document.getElementById('prof-firm2').textContent  = currentUser.firm;
  refreshProfileCount();
}
function refreshProfileCount() {
  document.getElementById('prof-count').textContent = history.length;
}

/* ═══════════════════════════════════════════════
   TOAST
═══════════════════════════════════════════════ */
var toastTimer;
function toast(msg, type) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show ' + (type||'');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { el.className = ''; }, 3000);
}

/* ═══════════════════════════════════════════════
   KEYBOARD SUPPORT
═══════════════════════════════════════════════ */
document.addEventListener('keydown', function(e) {
  if (!document.getElementById('s-login').classList.contains('active')) return;
  if (e.key >= '0' && e.key <= '9') npPress(e.key);
  else if (e.key === 'Backspace') npDel();
  else if (e.key === 'Enter') login();
});

/* ═══════════════════════════════════════════════
   CSS ANIMATION (spinner)
═══════════════════════════════════════════════ */
var style = document.createElement('style');
style.textContent = '@keyframes spin { 0%{transform:rotate(0)} 100%{transform:rotate(360deg)} }';
document.head.appendChild(style);
</script>
